name: mobile
description: "NaSCon '26 Multi-Sport League mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.1
  provider: ^6.1.2
  uuid: ^4.5.1
  # Used by the alternative UI in lib/core.dart and lib/screens/{club,sports,store}.dart (not wired into main.dart).
  shared_preferences: ^2.5.3
  shared_preferences_android: 2.4.15
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
